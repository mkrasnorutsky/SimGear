name: Apple XCFramework
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 apple/scripts/build_xcframework.py --jobs 3
      - run: python3 apple/scripts/validate_xcframework.py
      - uses: actions/upload-artifact@v4
        with:
          name: SimGear-iOS-XCFramework
          path: |
            dist/SimGear.xcframework
            dist/build-manifest.json
